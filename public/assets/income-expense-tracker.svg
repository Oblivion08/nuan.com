<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Income and Expense Tracker dashboard</title>
  <desc id="desc">A clean financial dashboard with income, expenses, balance, categories, and a monthly cash flow chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7f4"/><stop offset="1" stop-color="#e8edf5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2d9d78"/><stop offset="1" stop-color="#69c5a4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17334b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1000" height="700" rx="28" fill="url(#bg)"/>
  <rect x="30" y="30" width="940" height="640" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="30" y="30" width="210" height="640" rx="24" fill="#0b293d"/>
  <circle cx="76" cy="82" r="22" fill="#e7c66c"/><text x="76" y="90" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0b293d">N</text>
  <text x="112" y="79" font-family="Arial" font-size="18" font-weight="700" fill="#fff">NUAN</text><text x="112" y="99" font-family="Arial" font-size="9" letter-spacing="2" fill="#9eb1bd">MONEY TRACKER</text>
  <g font-family="Arial" font-size="13" fill="#a9bac4"><text x="62" y="165" fill="#fff">●  Overview</text><text x="62" y="215">○  Transactions</text><text x="62" y="265">○  Categories</text><text x="62" y="315">○  Monthly report</text></g>
  <text x="282" y="82" font-family="Georgia" font-size="29" font-weight="700" fill="#10283b">Income &amp; Expense Overview</text><text x="282" y="108" font-family="Arial" font-size="12" fill="#6f7d86">A clear view of everyday cash movement</text>
  <g font-family="Arial"><g transform="translate(282 140)"><rect width="200" height="104" rx="16" fill="#e8f6f0"/><text x="20" y="30" font-size="11" fill="#597069">TOTAL INCOME</text><text x="20" y="69" font-size="26" font-weight="700" fill="#218463">₱24,800</text><text x="20" y="90" font-size="10" fill="#3a9e7d">↑ 12% this month</text></g><g transform="translate(500 140)"><rect width="200" height="104" rx="16" fill="#fff1ec"/><text x="20" y="30" font-size="11" fill="#7e6660">TOTAL EXPENSES</text><text x="20" y="69" font-size="26" font-weight="700" fill="#d56b54">₱13,420</text><text x="20" y="90" font-size="10" fill="#b76552">54% of income</text></g><g transform="translate(718 140)"><rect width="220" height="104" rx="16" fill="#edf2fb"/><text x="20" y="30" font-size="11" fill="#687383">CURRENT BALANCE</text><text x="20" y="69" font-size="26" font-weight="700" fill="#315a86">₱11,380</text><text x="20" y="90" font-size="10" fill="#55799c">Available balance</text></g></g>
  <rect x="282" y="270" width="430" height="335" rx="18" fill="#f8fafb" stroke="#e2e9ed"/><text x="308" y="310" font-family="Arial" font-size="15" font-weight="700" fill="#21394a">Monthly cash flow</text>
  <g stroke="#dfe7eb"><path d="M320 350H680M320 410H680M320 470H680M320 530H680"/></g><path d="M325 510 C380 470 420 485 465 430 S545 395 590 350 S645 370 680 325" fill="none" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/><path d="M325 520 C390 535 420 500 470 515 S555 470 600 485 S650 445 680 455" fill="none" stroke="#e57b62" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial" font-size="10" fill="#788690"><text x="320" y="562">JAN</text><text x="390" y="562">FEB</text><text x="460" y="562">MAR</text><text x="530" y="562">APR</text><text x="600" y="562">MAY</text><text x="665" y="562">JUN</text></g>
  <rect x="735" y="270" width="203" height="335" rx="18" fill="#f8fafb" stroke="#e2e9ed"/><text x="760" y="310" font-family="Arial" font-size="15" font-weight="700" fill="#21394a">Top expenses</text>
  <g font-family="Arial" font-size="11" fill="#52636f"><text x="760" y="360">Supplies</text><rect x="760" y="372" width="148" height="9" rx="5" fill="#e7ecef"/><rect x="760" y="372" width="118" height="9" rx="5" fill="#e57b62"/><text x="760" y="420">Utilities</text><rect x="760" y="432" width="148" height="9" rx="5" fill="#e7ecef"/><rect x="760" y="432" width="86" height="9" rx="5" fill="#e5b662"/><text x="760" y="480">Delivery</text><rect x="760" y="492" width="148" height="9" rx="5" fill="#e7ecef"/><rect x="760" y="492" width="64" height="9" rx="5" fill="#5ca4c9"/><text x="760" y="540">Others</text><rect x="760" y="552" width="148" height="9" rx="5" fill="#e7ecef"/><rect x="760" y="552" width="42" height="9" rx="5" fill="#8f88c8"/></g>
</svg>
